
<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body {
  background: #101827;
  display: grid;
  place-items: center;
  min-height: 100vh;
  margin: 0;
  font-family: Arial, sans-serif;
}
.card {
  width: 310px;
  height: 190px;
  border-radius: 17px;
  background: linear-gradient(135deg, #a7d6e8, #307aa5, #12395f);
  color: white;
  padding: 22px;
  box-shadow: 0 15px 35px #0007;
  position: relative;
}
.brand {
  font-size: 21px;
  font-weight: bold;
  letter-spacing: 2px;
}
.chip {
  margin-top: 28px;
  width: 43px;
  height: 32px;
  background: linear-gradient(135deg, #f5e5a7, #b89a51);
  border-radius: 6px;
}
.name {
  position: absolute;
  bottom: 24px;
  font-size: 17px;
  letter-spacing: 2px;
}
.note {
  position: absolute;
  bottom: 8px;
  right: 20px;
  font-size: 9px;
}
</style>
</head>
<body>
<div class="card">
  <div class="brand">PREMIUM CARD</div>
  <div class="chip"></div>
  <div class="name">YOUR NAME</div>
  <div class="note">DEMO DESIGN ONLY</div>
</div>
</body>
</html>
